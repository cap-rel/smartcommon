default:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  interruptible: true

stages:
  - test
  - deploy

# Skip branch pipeline if HEAD already carries a tag - the tag pipeline
# runs in parallel and would do the same work.
.skip-if-tagged:
  before_script:
    - |
      if [ -z "$CI_COMMIT_TAG" ] && [ -n "$(git tag --points-at $CI_COMMIT_SHA)" ]; then
        echo "Branch HEAD is tagged - skipping redundant branch pipeline."
        exit 0
      fi

test:
  extends: .skip-if-tagged
  stage: test
  script:
    - npm ci
    - npm run lint
    - npm run test:run
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v.*/
  tags:
    - npm

publish-npm:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  script:
    - npm ci
    - npm run build
    - |
      cat > .npmrc <<EOF
      registry=https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
      //${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}
      EOF
    - npm publish
  tags:
    - npm

# Manual / scheduled cleanup of old npm versions in the GitLab Package
# Registry. Requires a Project Access Token with `api` scope, exposed as
# the CI/CD variable GITLAB_TOKEN (CI_JOB_TOKEN cannot delete packages).
# Trigger from Build > Pipelines > Run pipeline, then click the manual
# job in the resulting pipeline. Or attach a pipeline schedule.
cleanup-npm:
  stage: deploy
  image: alpine:latest
  cache: []
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache curl jq
  variables:
    KEEP: "20"
  script:
    - |
      curl -sf --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages?package_type=npm&order_by=created_at&sort=desc&per_page=100" \
        | jq -r '.[].id' \
        | tail -n +$((KEEP + 1)) \
        | while read -r id; do
            echo "Deleting package id=$id"
            curl -sf -X DELETE --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/$id"
          done
  tags:
    - npm
